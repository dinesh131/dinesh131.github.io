<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PEM Certificate Converter</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/node-forge/dist/forge.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#f1f5f9
}
.wrapper{max-width:1300px;margin:auto;padding:40px 20px}
.header{text-align:center;margin-bottom:30px}
.header h1{margin:0;font-size:34px}
.notice{text-align:center;opacity:.8;margin-bottom:20px}
.card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  padding:20px;
  margin-bottom:20px
}
.row{display:flex;gap:20px;flex-wrap:wrap}
.pane{flex:1;min-width:280px;display:flex;flex-direction:column}
.label{margin-bottom:6px;font-weight:600}
textarea,input,select{
  background:#0f172a;
  border:1px solid #334155;
  border-radius:10px;
  padding:10px;
  color:#fff;
  transition:.3s
}
textarea{
  min-height:200px;
  resize:vertical
}
textarea.dragover{
  border:2px dashed #22c55e;
  background:#111827
}
textarea:focus,input:focus,select:focus{
  border-color:#22c55e;
  outline:none
}
button{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  border:none;
  padding:14px 40px;
  border-radius:40px;
  font-size:18px;
  cursor:pointer;
  margin:30px auto;
  display:block;
  transition:.3s
}
button:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(34,197,94,.4)
}
.status{text-align:center;margin-top:10px;font-size:16px}
.success{color:#4ade80}
.error{color:#f87171}
@media(max-width:900px){
  .row{flex-direction:column}
}
</style>
</head>
<body>

<div class="wrapper">

<div class="header">
<h1>🔐 PEM → PKCS#12 / PFX Converter</h1>
</div>

<div class="notice">
All processing happens locally in your browser.  
No private keys are uploaded.
</div>

<div class="card">
<div class="row">

<div class="pane">
<div class="label">Private Key</div>
<input type="file" id="privKeyFile">
<textarea id="privKey" placeholder="Drag & drop private key here..."></textarea>
</div>

<div class="pane">
<div class="label">Certificate (.pem/.crt)</div>
<input type="file" id="certFile">
<textarea id="certPem" placeholder="Drag & drop certificate here..."></textarea>
</div>

<div class="pane">
<div class="label">CA Chain (Optional)</div>
<input type="file" id="caFile">
<textarea id="caPem" placeholder="Drag & drop CA chain here..."></textarea>
</div>

</div>
</div>

<div class="card">
<div class="row">

<div class="pane">
<div class="label">Password (Optional)</div>
<input type="password" id="password">
</div>

<div class="pane">
<div class="label">Output Format</div>
<select id="format">
<option value="p12">PKCS#12 (.p12)</option>
<option value="pfx">PFX (.pfx)</option>
</select>
</div>

<div class="pane">
<div class="label">Output Filename</div>
<input id="filename" placeholder="Auto-filled from CN">
</div>

</div>
</div>

<button id="convertBtn">Convert & Download</button>
<div id="status" class="status"></div>

</div>

<script>

// ---------- File Reader ----------
function readFile(input,target){
 if(!input.files.length)return;
 const reader=new FileReader();
 reader.onload=()=>document.getElementById(target).value=reader.result;
 reader.readAsText(input.files[0]);
}

privKeyFile.onchange=()=>readFile(privKeyFile,"privKey");
certFile.onchange=()=>{
 readFile(certFile,"certPem");
 setTimeout(autoFillCN,300);
};
caFile.onchange=()=>readFile(caFile,"caPem");

// ---------- Drag & Drop ----------
function enableDrop(id){
 const el=document.getElementById(id);
 el.addEventListener("dragover",e=>{
  e.preventDefault();
  el.classList.add("dragover");
 });
 el.addEventListener("dragleave",()=>el.classList.remove("dragover"));
 el.addEventListener("drop",e=>{
  e.preventDefault();
  el.classList.remove("dragover");
  const file=e.dataTransfer.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
   el.value=reader.result;
   if(id==="certPem")autoFillCN();
  };
  reader.readAsText(file);
 });
}

enableDrop("privKey");
enableDrop("certPem");
enableDrop("caPem");

// ---------- Helpers ----------
function getCN(cert){
 const cn=cert.subject.getField("CN");
 return cn?cn.value:"certificate";
}

function autoFillCN(){
 try{
  const cert=forge.pki.certificateFromPem(certPem.value.trim());
  filename.value=getCN(cert);
 }catch{}
}

function parseCerts(pem){
 const arr=[];
 const re=/-----BEGIN CERTIFICATE-----[\s\S]+?-----END CERTIFICATE-----/g;
 let m;
 while((m=re.exec(pem))!==null){
  arr.push(forge.pki.certificateFromPem(m[0]));
 }
 return arr;
}

function show(msg,err=false){
 status.textContent=msg;
 status.className="status "+(err?"error":"success");
}

// ---------- Convert ----------
convertBtn.onclick=()=>{
try{

 const keyPem=privKey.value.trim();
 const crtPem=certPem.value.trim();
 const caPemText=caPem.value.trim();
 const passwordVal=password.value;
 const fmt=format.value;

 if(!keyPem||!crtPem){
  show("Private key and certificate required.",true);
  return;
 }

 const key=forge.pki.privateKeyFromPem(keyPem);
 const cert=forge.pki.certificateFromPem(crtPem);
 const chain=parseCerts(caPemText);

 const alias=getCN(cert);
 let name=filename.value.trim()||alias;

 const p12Asn1=forge.pkcs12.toPkcs12Asn1(
  key,[cert,...chain],passwordVal,
  {algorithm:"3des",friendlyName:alias,generateLocalKeyId:true}
 );

 const der=forge.asn1.toDer(p12Asn1).getBytes();
 const buf=new Uint8Array(der.length);
 for(let i=0;i<der.length;i++)buf[i]=der.charCodeAt(i);

 const blob=new Blob([buf],{type:"application/x-pkcs12"});
 name+=fmt==="pfx"?".pfx":".p12";

 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download=name;
 a.click();

 show("Generated "+name+" successfully.");

}catch(e){
 show("Error: "+e.message,true);
}
};

</script>
</body>
</html>
